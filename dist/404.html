<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Ramratan Padhy</title>
  <meta name="robots" content="noindex,follow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #000;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --font: Consolas, 'Courier New', 'Lucida Console', monospace
    }

    html {
      font-size: 16px
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh
    }

    .container {
      max-width: 560px;
      padding: 3rem 2rem;
      border: 1px solid var(--border);
      margin: 2rem
    }

    .code {
      color: var(--text);
      font-weight: 700;
      font-size: 64px;
      line-height: 1
    }

    .msg {
      color: var(--text-muted);
      font-size: 14px;
      margin: 1.25rem 0 2rem
    }

    a {
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: .05em;
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid var(--border)
    }

    a:hover {
      background: var(--text);
      color: #000
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="code">&gt;_404</div>
    <p class="msg">That route doesn't resolve. Try the homepage, the blog, or the RSS feed.</p>
    <a href="/">&gt;_HOME</a>
  </div>

</body>

</html>
