name: Update Currently Building

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update dist/index.html
        run: python3 .github/scripts/update_current_project.py dist/index.html
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

      - name: Commit if changed
        run: |
          if git diff --quiet dist/index.html; then
            echo "No changes to dist/index.html"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.html
          git commit -m "chore: update currently building indicator [skip ci]"
          git push
