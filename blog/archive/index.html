  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #000;
      --bg-elevated: #131313;
      --bg-hover: #18181b;
      --text: #fafafa;
      --text-secondary: #c4c7c8;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --border: #27272a;
      --font: Consolas, 'Courier New', 'Lucida Console', monospace;
      --max-w: 760px;
      --space-md: 2rem;
      --space-lg: 4rem
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased
    }

    a {
      color: inherit;
      text-decoration: none
    }

    .container {
      max-width: var(--max-w);
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      min-height: 100vh;
      background: var(--bg)
    }

    /* Nav */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      height: 64px
    }

    .nav-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      padding: 0 1rem
    }

    @media(min-width:768px) {
      .nav-inner {
        padding: 0 var(--space-lg)
      }
    }

    .nav-brand {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.1em;
      background: var(--text);
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite
    }

    @keyframes blink {
      50% {
        opacity: 0
      }
    }

    .nav-links {
      display: flex;
      gap: 1rem;
      font-size: 13px;
      letter-spacing: .05em;
      color: var(--text-secondary)
    }

    @media(min-width:768px) {
      .nav-links {
        gap: 2rem
      }
    }

    .nav-links a.active {
      color: var(--text);
      border-bottom: 2px solid var(--text);
      padding-bottom: 4px
    }

    .nav-links a:hover {
      color: var(--text);
      transition: color .15s
    }

    /* Archive */
    .arch {
      padding: var(--space-md) 1rem var(--space-lg)
    }

    @media(min-width:768px) {
      .arch {
        padding: var(--space-md) var(--space-lg) var(--space-lg)
      }
    }

    .arch h1 {
      font-size: 1.75rem;
      margin-bottom: .5rem
    }

    .arch-sub {
      font-size: 13px;
      letter-spacing: .05em;
      color: var(--text-muted);
      margin-bottom: var(--space-md)
    }

    .year {
      font-size: 13px;
      letter-spacing: .1em;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: .5rem;
      margin-bottom: 1rem
    }

    .entry {
      display: flex;
      gap: 1.5rem;
      padding: .75rem 0;
      border-bottom: 1px solid var(--border);
      font-size: .95rem
    }

    .entry:hover {
      background: var(--bg-hover)
    }

    .entry time {
      flex-shrink: 0;
      width: 7rem;
      font-size: 13px;
      letter-spacing: .05em;
      color: var(--text-dim)
    }

    .entry a:hover {
      text-decoration: underline;
      text-underline-offset: 3px
    }

    /* Footer */
    .footer {
      max-width: var(--max-w);
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-top: 1px solid var(--border);
      padding: var(--space-md) 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center
    }

    @media(min-width:768px) {
      .footer {
        flex-direction: row;
        justify-content: space-between;
        padding: var(--space-md) var(--space-lg)
      }
    }

    .footer-name {
      font-size: 13px;
      letter-spacing: .05em;
      color: var(--text)
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
      font-size: 13px;
      letter-spacing: .05em;
      color: var(--text-secondary)
    }

    .footer-links a:hover {
      color: var(--text);
      transition: color .15s
    }
  </style>
</head>

<body>

    </div>
  </footer>

</body>

</html>
